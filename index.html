<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#080808">
    <meta name="description" content="Tashfain Ahmed — Audio Machine Learning and acoustic intelligence.">
    <title>Tashfain Ahmed / Audio Machine Learning</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="scene">
      <canvas id="ring" aria-hidden="true"></canvas>

      <div class="center-copy">
        <div class="eyebrow">Tashfain Ahmed</div>
        <h1>Audio Machine Learning</h1>
        <p>speech • acoustic sensing • deployable AI</p>
      </div>

      <div class="orbit" aria-label="Featured projects and research areas">
        <article class="node active" data-index="0" data-title="HATCI Voice" data-text="Vehicle cabin intelligence under real road, weather, and HVAC noise.">
          <span>HATCI</span>
          <small>voice</small>
        </article>

        <article class="node" data-index="1" data-title="ConformalMOS" data-text="Uncertainty-aware quality modeling for speech and audio perception.">
          <span>ConformalMOS</span>
          <small>quality</small>
        </article>

        <article class="node" data-index="2" data-title="Resource-Aware ML" data-text="Minimum viable data, practical systems, and robust deployment decisions.">
          <span>MVD</span>
          <small>systems</small>
        </article>

        <article class="node" data-index="3" data-title="Acoustic Sensing" data-text="Real-world diagnostics using smartphones, tools, and device variability.">
          <span>Acoustic</span>
          <small>sensing</small>
        </article>
      </div>

      <aside class="detail-panel" aria-live="polite">
        <span class="kicker">active</span>
        <h2 id="projectTitle">HATCI Voice</h2>
        <p id="projectText">Vehicle cabin intelligence under real road, weather, and HVAC noise.</p>
      </aside>

      <button id="instrument" aria-label="Play the sound ring. Hold and drag to change the sound, or hold Space and use arrow keys." aria-describedby="hint"></button>
      <p id="hint">hold &amp; move to make sound</p>
      <output id="note" aria-live="off"></output>
    </main>

    <script src="app.js"></script>
  </body>
</html>
